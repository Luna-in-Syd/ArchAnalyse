version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        USE_GPU: ${USE_GPU:-false}
    container_name: archanalyse-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-before-deploying}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@archanalyse.com}
    volumes:
      - ./backend/history_images:/app/history_images
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archanalyse-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped